name: her_era
description: A modern women safety application built for the HerEra Hackathon.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  syncfusion_flutter_gauges: ^23.1.43
  google_maps_flutter: ^2.5.0
  provider: ^6.1.1
  get_it: ^7.6.4
  shimmer: ^3.0.0
  animations: ^2.0.11
  cached_network_image: ^3.3.0
  http: ^1.1.0
  dio: ^5.3.3
  shared_preferences: ^2.2.2
  permission_handler: ^12.0.1
  geolocator: ^13.0.0
  flutter_staggered_animations: ^1.0.0
  url_launcher: ^6.3.2
  record: ^6.2.0
  noise_meter: ^5.1.0
  path_provider: ^2.1.2
  sensors_plus: ^7.0.0
  audioplayers: ^5.2.1
  flutter_tts: ^4.2.2
  uuid: ^4.3.3
  intl: ^0.18.1
  flutter_secure_storage: ^9.0.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
